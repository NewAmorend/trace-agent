[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-eval"
version = "0.1.0"
description = "Codex-first evaluation toolkit for coding agent trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Agent Trajectory Eval Contributors"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/anomalyco/opencode"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "coverage",
]

[project.scripts]
agent-trajectory-eval = "main:main"
trace-agent = "main:main"
trace-eval = "main:main"

[tool.setuptools]
py-modules = [
  "analyzer",
  "classifier",
  "evaluator",
  "lcb",
  "main",
  "models",
  "parser",
  "patterns",
  "report",
  "runner",
  "swe",
  "test_signals",
  "tree",
]
packages = ["adapters"]
